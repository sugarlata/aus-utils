[project]
name = "aus-utils"
version = "0.0.1"
description = "A collection of scrapers for Australian Utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.4",
    "selenium>=4.34.2",
]

[dependency-groups]
dev = ["black>=25.1.0"]

[tool.mypy]
python_version = "3.11"
exclude = ["tests/"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
warn_unused_configs = true
warn_return_any = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
